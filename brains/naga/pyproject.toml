[project]
name = "naga-brain"
version = "0.1.0"
description = "Business Brain for Naga"
requires-python = ">=3.12,<3.13"
dependencies = ["ai-sales-agent-core"]

[tool.uv.sources]
ai-sales-agent-core = { workspace = true }

[project.entry-points."revansa.brains"]
naga = "naga_brain.brain:BRAIN"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["naga_brain"]
