# Naga. Disabled until the placeholders below are replaced (see clients/_template/client.yaml).
client_id: naga
display_name: Naga
enabled: false
mode: approval
timezone: Africa/Tunis
daily_action_limit: 20
max_attempts: 3
opt_out_keywords: ["stop"]

brain:
  factory: naga_brain.brain:create_brain
  settings_version: 1
  # Naga's Brain settings are Naga's own data: catalog, languages, markets, payment, workflow,
  # cadence, tone. None of it is known yet, so none is written here. They are entered through the
  # client-facing configuration interface (later) or published with
  # `sales-agent config publish naga FILE`, and are validated against the consultative schema
  # (`sales_brain_kit.ConsultativeSalesSpec`; see docs/brain-settings.md, docs/brain-commerce.md and
  # the templates in docs/templates/). Naga cannot be enabled until they are valid.
  settings: {}

sheets:
  provider: google_sheets
  spreadsheet_id: TODO
  prospects_tab: Prospects
  actions_tab: Actions
  messages_tab: Messages
  log_tab: Log
  column_mapping: {}
  credentials_env: GOOGLE_APPLICATION_CREDENTIALS

llm:
  provider: openai
  api_key_env: OPENAI_API_KEY
  model: TODO

whatsapp:
  provider: whatsapp
  token_env: NAGA_WHATSAPP_TOKEN
  phone_number_id_env: NAGA_WHATSAPP_PHONE_NUMBER_ID
  app_secret_env: NAGA_WHATSAPP_APP_SECRET

schedule:
  daily_at: "09:00"
  days: [mon, tue, wed, thu, fri, sat]
  prepare_every_minutes: 60
  dispatch_every_minutes: 5
  recover_every_minutes: 15
