# Legacy file of a client that predates the database. Its identity, status and engine now belong in
# the database (`sales-agent db clients`); this file is only the fallback until that is applied.
client_id: naga
display_name: Naga
enabled: false
mode: approval
timezone: Africa/Tunis
daily_action_limit: 20
max_attempts: 3
opt_out_keywords: ["stop"]

brain:
  agent: consultative
  settings_version: 1
  # The client's commercial settings (catalog, languages, payment, workflow, tone) are its own
  # data, stored as published settings versions and validated against the consultative schema
  # (`sales_brain_kit.ConsultativeSalesSpec`; see docs/brain-settings.md). None is written here.
  settings: {}

sheets:
  provider: google_sheets
  spreadsheet_id: TODO
  prospects_tab: Prospects
  actions_tab: Actions
  messages_tab: Messages
  log_tab: Log
  column_mapping: {}
  credentials_env: GOOGLE_APPLICATION_CREDENTIALS

llm:
  provider: openai
  api_key_env: OPENAI_API_KEY
  model: TODO

whatsapp:
  provider: whatsapp
  token_env: NAGA_WHATSAPP_TOKEN
  phone_number_id_env: NAGA_WHATSAPP_PHONE_NUMBER_ID
  app_secret_env: NAGA_WHATSAPP_APP_SECRET

schedule:
  daily_at: "09:00"
  days: [mon, tue, wed, thu, fri, sat]
  prepare_every_minutes: 60
  dispatch_every_minutes: 5
  recover_every_minutes: 15
