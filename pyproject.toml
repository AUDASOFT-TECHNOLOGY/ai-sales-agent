[project]
name = "ai-sales-agent-core"
version = "0.1.0"
description = "Generic, multi-client AI Sales Agent Core"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "openai>=1.40",
    "google-api-python-client>=2.130",
    "google-auth>=2.30",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    # Brains are workspace members; installed here so the registry can import them.
    "naga-brain",
    "tounesimmo-brain",
]

[project.scripts]
sales-agent = "sales_app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sales_core", "src/sales_integrations", "src/sales_app"]

[tool.uv.workspace]
members = ["brains/*"]

[tool.uv.sources]
naga-brain = { workspace = true }
tounesimmo-brain = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "brains"]

[tool.ruff]
line-length = 100
target-version = "py312"
